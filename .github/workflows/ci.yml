name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_lifehub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ai_lifehub_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_0123456789abcdef
      JWT_REFRESH_SECRET: ci_refresh_secret_0123456789abcdef
      AI_PROVIDER: none
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm --prefix web ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run build
      - run: npm test
