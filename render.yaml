# ─────────────────────────────────────────────────────────────
# Render Blueprint — AI-LifeHub API
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo → Apply.
# Render reads this file from the repository root of the `main` branch and
# creates the web service below.
#
# Secrets: every real secret uses `sync: false`, so Render prompts for the
# value in the dashboard and stores it encrypted. Nothing sensitive is in git.
# The two JWT secrets are generated by Render itself (`generateValue: true`).
#
# Render allows at most 25 environment variables per service. Only variables the
# backend actually reads are declared here; everything else falls back to the
# defaults in server/src/config.ts.
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: ai-lifehub-api
    runtime: node
    plan: starter # 'free' also works but sleeps after inactivity
    region: singapore # choose the region closest to your Neon database
    branch: main
    rootDir: .
    buildCommand: npm ci && npm --prefix server ci && npm --prefix server run build
    # Runs after the build and before the new instance receives traffic.
    # `prisma migrate deploy` applies committed migrations only — it never
    # resets or deletes data. It connects through DIRECT_URL (Neon's unpooled
    # endpoint) because PgBouncer cannot run DDL reliably.
    preDeployCommand: npm --prefix server run db:deploy
    startCommand: npm --prefix server run start
    # Liveness probe: cheap, no database dependency.
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      # ── Runtime ──────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: APP_VERSION
        sync: false
      # Public URL of the Vercel frontend — used for CORS and reset links.
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: VERCEL_PROJECT_URL
        sync: false
      - key: COOKIE_SECURE
        value: true

      # ── Database (Neon) ──────────────────────────────────
      # DATABASE_URL = pooled string (host contains "-pooler") for the app.
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL = unpooled string, used only by prisma migrate deploy.
      - key: DIRECT_URL
        sync: false

      # ── Auth ─────────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30

      # ── AI (Gemini) ──────────────────────────────────────
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # ── Limits ───────────────────────────────────────────
      - key: AI_CHAT_DAILY_LIMIT
        value: 80
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: ALLOW_DEMO_DATA
        value: false
