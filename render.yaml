# ─────────────────────────────────────────────────────────────
# Render Blueprint — AI-LifeHub API
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo → Apply.
# Render reads this file from the repository root of the `main` branch and
# creates the web service below.
#
# COST: this blueprint provisions exactly ONE service, on Render's FREE plan.
# There is no Render database here — PostgreSQL is external (Neon).
#
# FREE PLAN NOTES
# - Free web services spin down after ~15 minutes of inactivity and cold-start
#   in roughly 30-60 s on the next request.
# - Render's Free plan does NOT run pre-deploy commands, so `prisma migrate
#   deploy` is NOT part of the deploy. Run migrations yourself once (see
#   DEPLOYMENT.md, or `npm run db:deploy` with Neon's direct URL) before the
#   first deploy and after every schema change.
# - Secrets use `sync: false`, so Render prompts for them in the dashboard and
#   stores them encrypted. Nothing sensitive is in git.
#
# Render allows at most 25 environment variables per service. Only variables the
# backend actually reads are declared here; everything else falls back to the
# defaults in server/src/config.ts.
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: ai-lifehub-api
    runtime: node
    plan: free
    region: singapore # choose the region closest to your Neon database
    branch: main
    rootDir: .
    buildCommand: npm ci && npm --prefix server ci && npm --prefix server run build
    # No preDeployCommand: not available on the free plan.
    # Apply migrations from your machine or a Neon SQL runbook instead.
    startCommand: npm --prefix server run start
    # Liveness probe: cheap, no database dependency.
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      # ── Runtime ──────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4000
      - key: APP_VERSION
        sync: false
      # Public URL of the Vercel frontend — used for CORS and reset links.
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: VERCEL_PROJECT_URL
        sync: false
      - key: COOKIE_SECURE
        value: true

      # ── Database (Neon, external — not a Render database) ─
      # DATABASE_URL = pooled string (host contains "-pooler") for the app.
      - key: DATABASE_URL
        sync: false
      # DIRECT_URL = unpooled string, used when running migrations.
      - key: DIRECT_URL
        sync: false

      # ── Auth ─────────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30

      # ── AI (Gemini) ──────────────────────────────────────
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      # ── Limits ───────────────────────────────────────────
      - key: AI_CHAT_DAILY_LIMIT
        value: 80
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: ALLOW_DEMO_DATA
        value: false
