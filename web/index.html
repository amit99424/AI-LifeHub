<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Mark-only icon for tabs and installs; the ground-tone one stays legible
         in a dark browser chrome, the white one on a light one. -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" media="(prefers-color-scheme: light)" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070A18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts are non-blocking: if the CDN is slow or unreachable, the system
         stack renders immediately instead of holding the whole app hostage. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      />
    </noscript>
    <meta
      name="description"
      content="AI-LifeHub - your AI-powered personal productivity companion. Track tasks, habits, mood, journal and focus sessions, and get insights grounded in your own history."
    />
    <title>AI-LifeHub - Personal productivity, understood</title>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
